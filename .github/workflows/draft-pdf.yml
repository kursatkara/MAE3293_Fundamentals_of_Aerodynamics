name: JOSE paper draft (temporary preview)
on:
  push:
    branches: [pdf-preview]
permissions:
  contents: write
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: openjournals/openjournals-draft-action@master
        with:
          journal: jose
          paper-path: paper/paper.md
      - run: |
          sudo chown -R "$(id -u)" paper || true
          git config user.name preview-bot
          git config user.email preview-bot@users.noreply.github.com
          git add -f paper/paper.pdf
          git commit -m "preview pdf [skip ci]"
          git push
